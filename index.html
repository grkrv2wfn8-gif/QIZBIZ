<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QIZBIZ - Ayollar Uchun Biznes Mentor</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#831843">
</head>
<body>
    <div class="app-container">
        <!-- Header qismi -->
        <header class="app-header">
            <div class="logo">👑 QIZBIZ</div>
            <p class="tagline">Sizning raqamli biznes mentor va maslahatingiz</p>
        </header>

        <!-- Asosiy ishchi zona -->
        <main class="main-card">
            <div class="input-group">
                <label for="user-input">Biznes g'oyangiz yoki savolingizni yozing:</label>
                <textarea id="user-input" placeholder="Masalan: Uyda shirinliklar biznesini qanday boshlasam bo'ladi? Mijozlarni qanday topaman?"></textarea>
            </div>

            <button class="action-btn" onclick="askAI()">
                <span>AI Mentordan Maslahat Olish</span> ✨
            </button>

            <div class="result-section">
                <h3>Mentor Javobi:</h3>
                <div id="ai-result" class="result-box">Savolingizga shu yerda professional maslahat beriladi...</div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
